[package]
name = "gendox-desktop"
version = "0.1.0"
description = "Gendox desktop app"
license = "AGPL-3.0"
edition = "2021"

[lib]
name = "gendox_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-window-state = "2"
tauri-plugin-opener = "2"
url = "2"
reqwest = { version = "0.12", features = ["json"] }
rfd = { version = "0.17", features = ["common-controls-v6"] }
tauri-plugin-clipboard-manager = "2"
getrandom = "0.3"
process-wrap = { version = "=10.0.1", default-features = false, features = ["tokio1", "process-group", "job-object", "kill-on-drop", "creation-flags"] }
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "macros"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-deep-link = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_System_Threading"] }
