# ===========================================================================
# Gendox ephemeral environment: a full stack for coding agents and local e2e
# runs, one per checkout. Plain Docker Compose, run from this folder:
#
#   ./init-env.sh                  once per checkout: writes .env (name and ports)
#   docker compose up -d --wait    start, or apply new migrations
#
# The name and ports come from .env, so nothing starts without one. Code is
# mounted from this checkout: the API jar from gendox-core-api/target and the
# frontend from gendox-frontend-v2/out. See README.md.
# ===========================================================================

x-ephemeral-labels: &ephemeral-labels
  dev.ctrlspace.gendox.ephemeral: "true"
  # init-env.sh reads this to skip slots that stopped environments still own.
  dev.ctrlspace.gendox.ephemeral.api-port: "${EPH_API_PORT:?No .env here. Run ./init-env.sh first}"
  dev.ctrlspace.gendox.ephemeral.project: "${COMPOSE_PROJECT_NAME:?No .env here. Run ./init-env.sh first}"

services:
  db:
    image: pgvector/pgvector:pg18-trixie
    labels: *ephemeral-labels
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: gendox_user
      POSTGRES_PASSWORD: gendox_user
      PGDATA: /pgdata
    # Durability is pointless for data that can always be rebuilt.
    command:
      - postgres
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
    volumes:
      - db-data:/pgdata
    configs:
      - source: create-keycloak-database
        target: /docker-entrypoint-initdb.d/10-keycloak.sql
    ports:
      - "127.0.0.1:${EPH_DB_PORT:?}:5432"
    healthcheck:
      # -h forces TCP: during first-time init Postgres answers only on its socket.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U gendox_user -d postgres"]
      interval: 1s
      timeout: 3s
      retries: 120
    stop_grace_period: 30s

  # Runs on every `up` and exits. Out-of-order and the ignore patterns let one
  # database follow any branch: new and older migrations are applied, and applied
  # ones missing from this checkout are accepted. An edited migration still fails.
  flyway:
    image: flyway/flyway:9.15.1
    labels: *ephemeral-labels
    depends_on:
      db:
        condition: service_healthy
    command: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://db:5432/postgres
      FLYWAY_USER: gendox_user
      FLYWAY_PASSWORD: gendox_user
      FLYWAY_SCHEMAS: gendox_core,gendox_jobs
      FLYWAY_LOCATIONS: filesystem:/flyway/migrations/repeatable,filesystem:/flyway/migrations/gendox-core,filesystem:/flyway/migrations/demo-data,filesystem:/flyway/migrations/test-data
      FLYWAY_BASELINE_ON_MIGRATE: "true"
      FLYWAY_OUT_OF_ORDER: "true"
      FLYWAY_IGNORE_MIGRATION_PATTERNS: "*:missing,*:future"
    volumes:
      - ../../database/src/main/resources/db/migrations:/flyway/migrations:ro

  keycloak:
    build:
      context: ../../gendox-keycloak
      dockerfile: ../gendox-compose-scripts/ephemeral/keycloak/Dockerfile
    labels: *ephemeral-labels
    depends_on:
      db:
        condition: service_healthy
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: gendox_admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: gendox_admin
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: gendox_user
      KC_DB_PASSWORD: gendox_user
    # The build options live in keycloak/Dockerfile, so --optimized skips the
    # rebuild. The import is a no-op when the realm is already in the database.
    command:
      - start
      - --optimized
      - --import-realm
      - --http-enabled=true
      - --hostname-strict=false
    volumes:
      - ./keycloak/gendox-idp-prod-realm.json:/opt/keycloak/data/import/gendox-idp-prod-realm.json:ro
    ports:
      - "127.0.0.1:${EPH_KEYCLOAK_PORT:?}:8080"
    healthcheck:
      # Ready only after the realm import, unlike a check on the open port.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /idp/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": *"UP"' <&3
      interval: 1s
      timeout: 3s
      retries: 180

  api:
    # The jar comes from the mounted target directory, not an image. After a
    # backend change: `mvn -q package -DskipTests`, then `docker compose restart api`.
    # A directory, because Maven replaces the jar file and a single-file mount
    # would keep pointing at the old one.
    image: eclipse-temurin:25-jdk-alpine
    labels: *ephemeral-labels
    # Starts alongside Keycloak: it only reads the signing keys on the first request.
    depends_on:
      db:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
    entrypoint:
      - sh
      - -c
      - >-
        jar="$$(ls -t /app/target/gendox-core-api-*.jar 2>/dev/null | head -1)";
        if [ -z "$$jar" ]; then echo "No API jar. Run: mvn -q package -DskipTests (in gendox-core-api)"; exit 1; fi;
        exec java -jar "$$jar"
    volumes:
      - ../../gendox-core-api/target:/app/target:ro
    environment:
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx${EPH_API_HEAP:-1g} -XX:TieredStopAtLevel=1
      SPRING_PROFILES_ACTIVE: docker-local,openai-integration,ephemeral
      DATABASE_URL: jdbc:postgresql://db:5432/postgres
      DATABASE_USERNAME: gendox_user
      DATABASE_PASSWORD: gendox_user
      KEYCLOAK_CLIENT_ID: gendox-private-client
      KEYCLOAK_CLIENT_SECRET: your-gendox-secret
      EPHEMERAL_KEYCLOAK_URL: http://keycloak:8080/idp
      EPHEMERAL_API_URL: http://localhost:${EPH_API_PORT:?}
      EPHEMERAL_FRONTEND_URL: http://localhost:${EPH_FRONTEND_PORT:?}
      RSA_KEY_PATH: file:/var/gendox/jwt/private_key.pem
      PROVEN_AI_ENABLED: "false"
      # Blank means the mock adapter only: point agents at mock-gemini-2.0-flash.
      OPENAI_KEY: ${OPENAI_KEY:-}
      COHERE_KEY: ${COHERE_KEY:-}
      GROQ_KEY: ${GROQ_KEY:-}
      ANTHROPIC_KEY: ${ANTHROPIC_KEY:-}
      GEMINI_KEY: ${GEMINI_KEY:-}
      MISTRAL_KEY: ${MISTRAL_KEY:-}
      VOYAGE_KEY: ${VOYAGE_KEY:-}
      NEBIUS_KEY: ${NEBIUS_KEY:-}
      XAI_KEY: ${XAI_KEY:-}
      FIRECRAWL_KEY: ${FIRECRAWL_KEY:-}
      GCLOUD_CLIENT_SECRET: ${GCLOUD_CLIENT_SECRET:-}
      DISCORD_TOKEN: ""
      AWS_ACCESS_KEY: ""
      AWS_SECRET_ACCESS_KEY: ""
      GENDOX_SPRING_EMAIL_HOST: ""
      GENDOX_SPRING_EMAIL_PORT: "587"
      GENDOX_SPRING_EMAIL_USERNAME: ""
      GENDOX_SPRING_EMAIL_PASSWORD: ""
    ports:
      - "127.0.0.1:${EPH_API_PORT:?}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/gendox/api/v1/actuator/health"]
      interval: 1s
      timeout: 3s
      retries: 180

  frontend:
    # Serves the static export this checkout built with `yarn build`. A new build
    # is live at once, with no restart. Without a build the stack still starts.
    image: nginx:alpine
    labels: *ephemeral-labels
    volumes:
      - ../../gendox-frontend-v2/out:/usr/share/nginx/html:ro
    configs:
      - source: frontend-nginx
        target: /etc/nginx/conf.d/default.conf
      - source: frontend-runtime-env
        target: /etc/gendox/env-config.js
    ports:
      - "127.0.0.1:${EPH_FRONTEND_PORT:?}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/env-config.js"]
      interval: 1s
      timeout: 3s
      retries: 60

volumes:
  db-data:
    labels: *ephemeral-labels

configs:
  create-keycloak-database:
    content: |
      CREATE DATABASE keycloak;

  frontend-nginx:
    content: |
      server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;
        error_page 404 /404.html;
        # Redirects such as /login to /login/ must keep the published port, which
        # nginx does not know: it listens on 80 inside the container.
        absolute_redirect off;

        # The build is the same for every environment: only this file differs.
        location = /env-config.js {
          alias /etc/gendox/env-config.js;
          add_header Cache-Control "no-store";
        }
      }

  frontend-runtime-env:
    content: |
      window.__GENDOX_ENV__ = {
        NEXT_PUBLIC_GENDOX_URL: "http://localhost:${EPH_API_PORT:?}/gendox/api/v1/",
        NEXT_PUBLIC_OIDC_AUTHORITY: "http://localhost:${EPH_KEYCLOAK_PORT:?}/idp/realms/gendox-idp-prod",
        NEXT_PUBLIC_OIDC_CLIENT_ID: "gendox-pkce-public-client-local",
        NEXT_PUBLIC_OIDC_REDIRECT_URI: "http://localhost:${EPH_FRONTEND_PORT:?}/oidc-callback/",
        NEXT_PUBLIC_OIDC_POST_LOGOUT_REDIRECT_URI: "http://localhost:${EPH_FRONTEND_PORT:?}/login",
        NEXT_PUBLIC_OIDC_SILENT_REDIRECT_URI: "http://localhost:${EPH_FRONTEND_PORT:?}/silent-renew"
      }
