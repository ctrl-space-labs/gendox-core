# ===========================================================================
# Gendox - full local development & testing stack.
#
# Completely isolated from the other compose setups:
#   * The compose project is named gendox-claude-test-env-to-delete (see `name:` below), so the volumes
#     here are gendox-claude-test-env-to-delete_postgres-data etc. Your existing local database
#     is untouched, and `docker compose down -v` here cannot affect it.
#   * Every published port is shifted, so this can run alongside dev-ci.
#   * Container names are prefixed gendox-claude-test-env-to-delete-* for the same reason.
#
#   Service     this stack   dev-ci / build-ci
#   database    5533         5433
#   api         8081         8080
#   keycloak    8543         8443
#   frontend    3100         3000
#
# Usage (an env file is required - compose only auto-loads a file named .env):
#   docker compose --env-file .env.local up -d
#   docker compose --env-file .env.local down        # keeps the database
#   docker compose --env-file .env.local down -v     # wipes it and re-runs migrations
#
# Migrations run inside the database container on FIRST BOOT of an empty volume,
# via database/docker-flyway-db-init.sh in /docker-entrypoint-initdb.d. To pick up
# new migrations you must therefore `down -v`, not just restart.
#
# API keys: put them in .env.local, which is gitignored (.gitignore covers .env*).
# Never `git add -f` that file.
# ===========================================================================

version: '3'

name: gendox-claude-test-env-to-delete

services:
  gendox-claude-test-env-to-delete-database:
    build:
      context: ../../database
      dockerfile: Dockerfile
    image: gendox-claude-test-env-to-delete-database:latest
    container_name: gendox-claude-test-env-to-delete-database
#    command: -c config_file=/etc/postgresql.conf
    volumes:
      - postgres-data:/var/lib/postgresql
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    networks:
      gendox_claude_test_env_to_delete_network:
        aliases:
          - gendox-database
    expose:
      - "5432"
    ports:
      - "${DATABASE_PORT}:5432"
    healthcheck:
      test: psql -h localhost -p 5432 -U $DATABASE_USERNAME -d $DATABASE_NAME -t -c "SELECT * from gendox_core.flyway_schema_history" | grep . || exit 1
      interval: 10s
      timeout: 30s
      retries: 30
      start_period: 15s
    restart: unless-stopped

  # -------------------------------------------------------------------
  # service that builds a custom truststore for gendox-core-api that
  # includes self-signed certificate from keycloak
  # -------------------------------------------------------------------
  gendox-claude-test-env-to-delete-truststore-init:
    image: eclipse-temurin:25-jdk
    container_name: gendox-claude-test-env-to-delete-truststore-init
    environment:
      - KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD}
    volumes:
      # Share Keycloak's keystore volume (read-only)
      - keycloak-data:/opt/keycloak/conf:ro
      # Custom truststore volume that will be used by gendox-core-api
      - gendox-truststore:/truststore
    command:
      - /bin/bash
      - -c
      - |
        set -e

        KEYSTORE_FILE=/opt/keycloak/conf/server.keystore
        TRUSTSTORE_DIR=/truststore
        TRUSTSTORE_FILE=$$TRUSTSTORE_DIR/cacerts
        KEYCLOAK_CERT=$$TRUSTSTORE_DIR/keycloak.pem

        echo "Waiting for Keycloak keystore at $$KEYSTORE_FILE..."
        until [ -f "$$KEYSTORE_FILE" ]; do
          echo "Keycloak keystore not found yet, retrying in 5s..."
          sleep 5
        done

        echo "Exporting certificate from Keycloak keystore..."
        keytool -exportcert \
          -rfc \
          -alias server \
          -keystore "$$KEYSTORE_FILE" \
          -storepass "$$KEYSTORE_PASSWORD" \
          -file "$$KEYCLOAK_CERT"

        echo "Copying default JVM cacerts to custom truststore..."
        mkdir -p "$$TRUSTSTORE_DIR"
        cp "$$JAVA_HOME/lib/security/cacerts" "$$TRUSTSTORE_FILE"

        echo "Importing Keycloak certificate into custom truststore..."
        keytool -importcert \
          -noprompt \
          -alias keycloak-local \
          -file "$$KEYCLOAK_CERT" \
          -keystore "$$TRUSTSTORE_FILE" \
          -storepass changeit

        echo "Custom truststore ready at $$TRUSTSTORE_FILE"
    networks:
      - gendox_claude_test_env_to_delete_network
    restart: "no"

  gendox-claude-test-env-to-delete-core-api:
    build:
      context: ../../gendox-core-api
      dockerfile: Dockerfile
      args:
        - PROVEN_AI_GIT_REPOSITORY=${PROVEN_AI_GIT_REPOSITORY}
        - PROVEN_AI_GIT_BRANCH=${PROVEN_AI_GIT_BRANCH}
    image: gendox-claude-test-env-to-delete-core-api:latest
    container_name: gendox-claude-test-env-to-delete-core-api
    volumes:
      - ~/.aws/:/root/.aws:ro
      # Mount the custom truststore (read-only) created by gendox-truststore-init
      - gendox-truststore:/opt/gendox-truststore:ro
    depends_on:
      gendox-claude-test-env-to-delete-database:
        condition: service_healthy
      gendox-claude-test-env-to-delete-keycloak:
        condition: service_healthy
      gendox-claude-test-env-to-delete-truststore-init:
        condition: service_completed_successfully
    environment:
      # Append trustStore config to the existing JVM options
      - JAVA_TOOL_OPTIONS=-Xms512m -Xmx1536m -Djavax.net.ssl.trustStore=/opt/gendox-truststore/cacerts -Djavax.net.ssl.trustStorePassword=changeit
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_USERNAME=${DATABASE_USERNAME}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      # Logs outgoing LLM request bodies (contains prompts) - dev stack only.
      - LOGGING_LEVEL_DEV_CTRLSPACE_GENDOX_GENDOXCOREAPI_AI_ENGINE_SERVICES_OPENAI=${LLM_REQUEST_LOG_LEVEL:-INFO}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID}
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET}
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - OPENAI_KEY=${OPENAI_KEY}
      - COHERE_KEY=${COHERE_KEY}
      - RSA_KEY_PATH=${RSA_KEY_PATH}
      - GROQ_KEY=${GROQ_KEY}
      - ANTHROPIC_KEY=${ANTHROPIC_KEY}
      - GEMINI_KEY=${GEMINI_KEY}
      - MISTRAL_KEY=${MISTRAL_KEY}
      - VOYAGE_KEY=${VOYAGE_KEY}
      - NEBIUS_KEY=${NEBIUS_KEY}
      - XAI_KEY=${XAI_KEY}
      - GCLOUD_CLIENT_SECRET=${GCLOUD_CLIENT_SECRET}
      - GENDOX_SPRING_EMAIL_HOST=${GENDOX_SPRING_EMAIL_HOST}
      - GENDOX_SPRING_EMAIL_PORT=${GENDOX_SPRING_EMAIL_PORT}
      - GENDOX_SPRING_EMAIL_USERNAME=${GENDOX_SPRING_EMAIL_USERNAME}
      - GENDOX_SPRING_EMAIL_PASSWORD=${GENDOX_SPRING_EMAIL_PASSWORD}
      - PROVEN_AI_ENABLED=${PROVEN_AI_ENABLED}
      - AWS_ACCESS_KEY=${AWS_ACCESS_KEY}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD}
      - FILE_STORAGE_PATH=${FILE_STORAGE_PATH}
    networks:
      - gendox_claude_test_env_to_delete_network
    ports:
      - "${GENDOX_BACKEND_PORT}:8080"
    restart: unless-stopped


  gendox-claude-test-env-to-delete-keycloak:
    build:
      context: ../../gendox-keycloak
      dockerfile: Dockerfile
    image: gendox-claude-test-env-to-delete-keycloak:latest
    container_name: gendox-claude-test-env-to-delete-keycloak
    healthcheck:
      test: [ "CMD-SHELL", "echo > /dev/tcp/localhost/8443 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    depends_on:
      gendox-claude-test-env-to-delete-database:
        condition: service_healthy
    environment:
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - KC_DB=postgres
      - KC_DB_URL=${KC_DB_URL}
      - KC_DB_USERNAME=${KC_DB_USERNAME}
      - KC_DB_PASSWORD=${KC_DB_PASSWORD}
      - KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD}
      - KEYSTORE_FILE=/opt/keycloak/conf/server.keystore
      - KC_CACHE=local
    entrypoint: [ ]
    command:
      - /bin/bash
      - -c
      - |
        if [ -f "$$KEYSTORE_FILE" ] && { [ ! -s "$$KEYSTORE_FILE" ] || ! keytool -list -keystore "$$KEYSTORE_FILE" -storepass "${KEYSTORE_PASSWORD}" > /dev/null 2>&1; }; then
          echo "Keystore is empty or invalid. Deleting it."
          rm -f "$$KEYSTORE_FILE"
        fi
        if [ ! -f "$$KEYSTORE_FILE" ]; then
          echo "Generating new keystore and key pair.."
          keytool -genkeypair \
            -storepass "${KEYSTORE_PASSWORD}" \
            -storetype PKCS12 \
            -keyalg RSA \
            -keysize 2048 \
            -dname "CN=localhost" \
            -alias server \
            -validity 365 \
            -ext "SAN=DNS:localhost,IP:127.0.0.1,DNS:gendox-claude-test-env-to-delete-keycloak,DNS:gendox-keycloak" \
            -keystore "$$KEYSTORE_FILE" \
            -noprompt
        else
          echo "Using existing valid keystore."
        fi
        echo "Starting Keycloak..."
        /opt/keycloak/bin/kc.sh start \
          --http-relative-path="${KEYCLOAK_HTTP_RELATIVE_PATH}" \
          --http-enabled=true \
          --http-port=8080 \
          --features=token-exchange \
          --hostname-strict=false \
          --https-key-store-file="$$KEYSTORE_FILE" \
          --https-key-store-password "${KEYSTORE_PASSWORD}" \
          --spi-theme-static-max-age=600 \
          --spi-theme-cache-themes=true \
          --spi-theme-cache-templates=true &

        KEYCLOAK_PID=$!

        is_keycloak_ready() {
          (echo > /dev/tcp/localhost/8443) >/dev/null 2>&1
        }

        echo 'Waiting for Keycloak to be ready...'
        until is_keycloak_ready; do
          echo 'Keycloak not ready yet. Retrying in 5 seconds...'
          sleep 5
        done

        echo 'Keycloak is ready. Running initialization script.'
        cd /opt/keycloak/custom-conf && bash gendox-local-init.sh

        # Extra step for this stack only: seed a test user. Bind-mounted rather
        # than baked into the image, so editing it needs no rebuild.
        if [ -f /opt/keycloak/dev-init/gendox-test-users.sh ]; then
          echo 'Seeding development test users.'
          bash /opt/keycloak/dev-init/gendox-test-users.sh || echo 'Test user seeding failed (non-fatal).'
        fi

        wait $$KEYCLOAK_PID
    networks:
      gendox_claude_test_env_to_delete_network:
        aliases:
          # application-docker-local.yml hardcodes this hostname.
          - gendox-keycloak
    ports:
      - "${KEYCLOAK_PORT}:8443"
      # Plain HTTP for the browser; the API still uses HTTPS internally.
      - "${KEYCLOAK_HTTP_PORT}:8080"
    volumes:
      - keycloak-data:/opt/keycloak/conf
      - ./keycloak-init:/opt/keycloak/dev-init:ro
    restart: unless-stopped


#  Frontend needs to be built with proper environment variables
  gendox-claude-test-env-to-delete-frontend:
    build:
      context: ../../gendox-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_OIDC_AUTHORITY: ${NEXT_PUBLIC_GENDOX_OIDC_AUTHORITY}
        NEXT_PUBLIC_OIDC_CLIENT_ID: ${NEXT_PUBLIC_GENDOX_OIDC_CLIENT_ID}
        NEXT_PUBLIC_OIDC_REDIRECT_URI: ${NEXT_PUBLIC_GENDOX_OIDC_REDIRECT_URI}
        NEXT_PUBLIC_OIDC_POST_LOGOUT_REDIRECT_URI: ${NEXT_PUBLIC_GENDOX_OIDC_POST_LOGOUT_REDIRECT_URI}
        NEXT_PUBLIC_OIDC_SILENT_REDIRECT_URI: ${NEXT_PUBLIC_GENDOX_OIDC_SILENT_REDIRECT_URI}
        NEXT_PUBLIC_GENDOX_URL: ${NEXT_PUBLIC_GENDOX_BACKEND_URL}
        NEXT_PUBLIC_PROVEN_AI_URL: ${NEXT_PUBLIC_PROVEN_AI_FRONTEND_URL}
        NEXT_PUBLIC_GEE_CLIENT_ID: ${NEXT_PUBLIC_GENDOX_GEE_CLIENT_ID}
    image: gendox-claude-test-env-to-delete-frontend:latest
    container_name: gendox-claude-test-env-to-delete-frontend
    environment:
      NEXT_PUBLIC_OIDC_AUTHORITY: ${NEXT_PUBLIC_GENDOX_OIDC_AUTHORITY}
      NEXT_PUBLIC_OIDC_CLIENT_ID: ${NEXT_PUBLIC_GENDOX_OIDC_CLIENT_ID}
      NEXT_PUBLIC_OIDC_REDIRECT_URI: ${NEXT_PUBLIC_GENDOX_OIDC_REDIRECT_URI}
      NEXT_PUBLIC_OIDC_POST_LOGOUT_REDIRECT_URI: ${NEXT_PUBLIC_GENDOX_OIDC_POST_LOGOUT_REDIRECT_URI}
      NEXT_PUBLIC_OIDC_SILENT_REDIRECT_URI: ${NEXT_PUBLIC_GENDOX_OIDC_SILENT_REDIRECT_URI}
      NEXT_PUBLIC_GENDOX_URL: ${NEXT_PUBLIC_GENDOX_BACKEND_URL}
      NEXT_PUBLIC_PROVEN_AI_URL: ${NEXT_PUBLIC_PROVEN_AI_FRONTEND_URL}
      NEXT_PUBLIC_GEE_CLIENT_ID: ${NEXT_PUBLIC_GENDOX_GEE_CLIENT_ID}
    ports:
      - "${GENDOX_FRONTEND_PORT}:80"
    networks:
      - gendox_claude_test_env_to_delete_network

networks:
  gendox_claude_test_env_to_delete_network:

volumes:
  postgres-data:
  keycloak-data:
  gendox-truststore:
